name: Jahfan preview and compatibility

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jahfan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Rust and Android target
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: jahfan-android
      - name: Test mobile engine compatibility
        run: cargo test --locked -p pdfcraft-android --lib
      - name: Test upgraded engine libraries
        run: cargo test --locked -p pdfcraft-create -p pdfcraft-export -p pdfcraft-annot -p pdfcraft-render --lib
      - name: Prepare Android tools
        shell: pwsh
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          $sdkmanager = "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          $packages = & $sdkmanager --list
          $platform = if ($packages -match 'platforms;android-37\.0\s') { 'platforms;android-37.0' } else { 'platforms;android-37' }
          & $sdkmanager $platform "ndk;29.0.14206865"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build preview and run Android unit tests
        working-directory: apps/pdfcraft-android/android
        shell: pwsh
        run: ./gradlew.bat assembleDebug testDebugUnitTest -Ppdfcraft.abis=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: jahfan-preview-arm64
          path: apps/pdfcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jahfan-test-results
          path: apps/pdfcraft-android/android/app/build/reports/tests/
          if-no-files-found: ignore
